  <meta name="keywords" content="Y Combinator, YC, 新創公司, startup, 創業投資, 矽谷, 加速器, AI, SaaS, Fintech, 趨勢分析">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / LINE -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="YC 新創監測站 — Y Combinator 最新投資動態">
  <meta property="og:description" content="追蹤 Y Combinator 最新批次新創公司資料，產業分類、趨勢分析、公司詳情一覽無遺。台灣繁體中文介面。">
  <meta property="og:url" content="https://thisisowenlo.github.io/Launch_yc_minitor/">
  <meta property="og:site_name" content="YC 新創監測站">
  <meta property="og:locale" content="zh_TW">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="YC 新創監測站 — Y Combinator 最新投資動態">
  <meta name="twitter:description" content="追蹤 Y Combinator 最新批次新創公司，產業分類與趨勢分析。繁體中文介面，即時同步。">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "YC 新創監測站",
    "description": "追蹤 Y Combinator 最新批次新創公司資料，產業分類、趨勢分析、公司詳情一覽無遺。台灣繁體中文介面。",
    "url": "https://thisisowenlo.github.io/Launch_yc_minitor/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "inLanguage": "zh-TW",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "TWD"
    }
  }
  </script>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top">
        <h1>YC 新創監測站</h1>
        <p class="subtitle">Y Combinator 最新投資動態 · 繁體中文</p>
      </div>
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <span class="stat-value" id="totalCount">-</span>
          <span class="stat-label">總公司數</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="batchName">-</span>
          <span class="stat-label">當前批次</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="lastSync">-</span>
          <span class="stat-label">同步時間</span>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="controls-inner">
      <div class="controls-top-row">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜尋新創公司...">
          <button class="clear-btn" id="clearSearch" style="display:none">&times;</button>
        </div>
      </div>
      <div class="batch-chips" id="batchChips"></div>
      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-industry="all">全部</button>
      </div>
    </div>
  </div>

  <main class="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在同步 YC 最新資料...</p>
    </div>
    <div class="error" id="error" style="display:none">
      <p>無法載入資料，請稍後再試</p>
      <button onclick="app.loadData()">重新載入</button>
    </div>
    <div class="industry-summary" id="industrySummary" style="display:none">
      <h2>投資領域分布</h2>
      <div class="industry-chart" id="industryChart"></div>
    </div>
    <div class="company-list" id="companyList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <p>找不到符合條件的新創公司</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="list" onclick="app.switchView('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>新創列表</span>
    </button>
    <button class="nav-btn" data-view="trends" onclick="app.switchView('trends')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>趨勢分析</span>
    </button>
    <button class="nav-btn" data-view="about" onclick="app.switchView('about')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>關於</span>
    </button>
  </nav>

  <!-- Company detail modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="companyModal">
      <button class="modal-close" onclick="app.closeModal()">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <noscript>
    <div style="max-width:700px;margin:40px auto;padding:20px;font-family:sans-serif;color:#333">
      <h1>YC 新創監測站</h1>
      <p>這是一個追蹤 Y Combinator 最新投資動態的網頁應用程式。自動同步 YC 公開的新創公司資料，將產業分類與標籤翻譯為繁體中文，提供產業分布圖表與趨勢分析。</p>
      <h2>功能特色</h2>
      <ul>
        <li>即時同步 YC 各批次（W26、S25、W25 等）新創公司資料</li>
        <li>產業分類篩選：AI、SaaS、Fintech、醫療科技等</li>
        <li>關鍵字搜尋新創公司</li>
        <li>投資領域分布圖表與趨勢分析</li>
        <li>行動裝置優先的響應式設計</li>
      </ul>
      <p>請啟用 JavaScript 以使用完整功能。</p>
    </div>
  </noscript>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
